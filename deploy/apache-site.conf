# Install: sudo cp apache-site.conf /etc/apache2/sites-available/attendance.conf
#          sudo a2enmod rewrite && sudo a2ensite attendance && sudo a2dissite 000-default
#          sudo systemctl reload apache2
<VirtualHost *:80>
    ServerName attendance.local
    # Only the public/ folder is served: .env, the code and the database stay unreachable.
    DocumentRoot /var/www/attendance-app/public

    <Directory /var/www/attendance-app/public>
        AllowOverride All
        Require all granted
    </Directory>

    # A full sync can take a few minutes on Wi-Fi
    Timeout 300

    ErrorLog ${APACHE_LOG_DIR}/attendance-error.log
    CustomLog ${APACHE_LOG_DIR}/attendance-access.log combined
</VirtualHost>
